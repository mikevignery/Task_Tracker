<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('tt-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" hidden>
      <a class="brand" href="#/dashboard"><span class="logo" aria-hidden="true"></span>Task Tracker</a>
      <nav class="sidenav">
        <a href="#/dashboard" data-nav="dashboard">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="2.5" y="2.5" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="2.5" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="2.5" y="11" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="11" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#/projects" data-nav="projects">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M2.5 5.5c0-.8.7-1.5 1.5-1.5h3.3l1.4 1.8H16c.8 0 1.5.7 1.5 1.5v8.2c0 .8-.7 1.5-1.5 1.5H4c-.8 0-1.5-.7-1.5-1.5V5.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="nav-label">Projects</span>
        </a>
        <a href="#/tasks" data-nav="tasks">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="2.5" y="3" width="15" height="14" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 7.5h9M5.5 10.5h9M5.5 13.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="nav-label">Tasks</span>
        </a>
        <a href="#/import" data-nav="import">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 13.5V3.5M6 7.5l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 13v2.5c0 .8.7 1.5 1.5 1.5h10c.8 0 1.5-.7 1.5-1.5V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="nav-label">Import transcript</span>
        </a>
        <a href="#/search" data-nav="search">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="9" cy="9" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="13.6" y1="13.6" x2="17.5" y2="17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="nav-label">Search</span>
        </a>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot">
        <div id="timer" class="timer" hidden>
          <a id="timer-link" href="#/tasks"></a>
          <span id="timer-clock">00:00:00</span>
          <button type="button" id="timer-stop" class="btn small danger">Stop</button>
        </div>
        <button type="button" id="theme-toggle" class="btn ghost theme-toggle" aria-label="Switch between light and dark mode">
          <svg id="icon-sun" class="theme-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false" hidden><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4M15.3 15.3l-1.4-1.4M6.1 6.1L4.7 4.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg id="icon-moon" class="theme-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false" hidden><path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span id="theme-toggle-label" class="theme-toggle-label">Light mode</span>
        </button>
        <div class="side-user">
          <span id="user-email" class="muted small"></span>
          <button type="button" id="signout" class="btn small">Sign out</button>
        </div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar" id="topbar" hidden>
        <form id="global-search-form" class="gsearch" role="search">
          <svg class="gsearch-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="13.6" y1="13.6" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="search" id="global-search" placeholder="Search everything…" aria-label="Search everything">
        </form>
      </header>

      <main id="app" class="container">
        <p class="muted">Loading&hellip;</p>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- 1. Your Supabase URL + anon key go in config.js -->
  <script src="config.js?v=2"></script>
  <!-- 2. Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 3. The app -->
  <script src="app.js?v=12"></script>
</body>
</html>
